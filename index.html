<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadri Aminu</title>
  <link rel="icon" type="image/png" href="Q.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #121212;
      color: white;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
    }
    ::selection { background-color: #E0F11F; color: black; }

    .font-massive {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 260px;
      line-height: 110%;
      letter-spacing: -0.02em;
      font-weight: 900;
    }

    @media (max-width: 1024px) {
      .font-massive { font-size: 140px; }
    }
    @media (max-width: 640px) {
      .font-massive { font-size: 100px; }
    }

    /* Wrapper holds both text layers so the mask coordinates line up exactly */
    #hero-text-wrap {
      position: relative;
      display: inline-block;
    }

    /* Bottom layer: the plain yellow text, always visible */
    #base-text {
      color: #E0F11F;
    }

    /* Top layer: identical text, filled with the photo instead of colour.
       background-clip: text means the photo can only ever paint inside
       the letter shapes, never the black background around them. */
    #photo-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      color: transparent;
      background-image: url('headshot.png');
      background-size: cover;
      background-position: center;
      -webkit-background-clip: text;
      background-clip: text;
      pointer-events: none;

      /* This second mask is what confines the reveal to a small window
         around the cursor, rather than showing the photo through every
         letter at once. --mx/--my are set by the mousemove handler below. */
      -webkit-mask-image: radial-gradient(circle 105px at var(--mx, -9999px) var(--my, -9999px), #000 62%, transparent 100%);
      mask-image: radial-gradient(circle 105px at var(--mx, -9999px) var(--my, -9999px), #000 62%, transparent 100%);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- NAVIGATION BAR -->
  <nav class="w-full flex items-center justify-between px-[36px] md:px-[136px] py-5 max-w-[928px] mx-auto">
    <img src="Q.png" alt="Logo" class="w-16 h-[52px] object-contain" />

    <div class="flex items-center gap-6 h-[42px]">
      <button id="theme-toggle" type="button" aria-pressed="true" aria-label="Toggle switch"
        class="w-[83px] h-[42px] bg-[#1A1A1A] rounded-[100px] p-[3px] flex items-center cursor-pointer">
        <div id="theme-toggle-knob" class="w-[36px] h-[36px] bg-[#0A0A0A] rounded-full shadow-md transition-transform duration-200" style="transform: translateX(41px);"></div>
      </button>

      <button class="bg-[#F4F4F4] text-black font-medium text-[13px] px-5 h-[42px] rounded-[100px] hover:scale-105 transition-transform duration-300 whitespace-nowrap">
        Let's Work Together 🚀
      </button>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <section class="relative flex flex-col items-center justify-center flex-grow mt-[80px] px-4">
    <p class="text-[#7A7A7A] uppercase tracking-[0.25em] text-[11px] md:text-[13px] mb-8 font-medium z-10 text-center">
      Meet Quadri — Your Strategic Growth Partner
    </p>

    <div id="hero-text-wrap">
      <h1 id="base-text" class="font-massive text-center cursor-default uppercase">
        Quadri<br />Aminu
      </h1>
      <h1 id="photo-text" aria-hidden="true" class="font-massive text-center uppercase">
        Quadri<br />Aminu
      </h1>
    </div>
  </section>

  <!-- INTRODUCTION SECTION -->
  <section class="flex flex-col items-center mt-24 md:mt-32 px-6 max-w-[850px] mx-auto pb-32">
    <div class="text-[#E0F11F] text-3xl mb-10">✦</div>
    <p class="text-[#D1D1D1] text-[22px] md:text-[28px] leading-[1.6] text-center font-medium">
      I'm Quadri Aminu, a Product & Delivery Leader blending product strategy,
      operational clarity, and technical execution to build digital systems that
      work simply, scale effortlessly, and serve real user needs.
    </p>
  </section>

  <script>
    // Cosmetic only, the site always stays in dark mode. This just lets
    // the knob slide across the track on click so it doesn't look dead.
    const toggle = document.getElementById('theme-toggle');
    const knob = document.getElementById('theme-toggle-knob');

    toggle.addEventListener('click', () => {
      const isOn = toggle.getAttribute('aria-pressed') === 'true';
      toggle.setAttribute('aria-pressed', String(!isOn));
      knob.style.transform = isOn ? 'translateX(0)' : 'translateX(41px)';
    });

    const wrap = document.getElementById('hero-text-wrap');
    const photoText = document.getElementById('photo-text');

    wrap.addEventListener('mousemove', (e) => {
      const rect = wrap.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      photoText.style.setProperty('--mx', `${x}px`);
      photoText.style.setProperty('--my', `${y}px`);
    });

    wrap.addEventListener('mouseleave', () => {
      photoText.style.setProperty('--mx', '-9999px');
      photoText.style.setProperty('--my', '-9999px');
    });
  </script>
</body>
</html>
