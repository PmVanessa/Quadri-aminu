<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadri Aminu</title>
  
  <!-- Import Google Fonts for pixel-perfect typography matching -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      background-color: #121212;
      color: white;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif; /* Clean body font */
    }
    ::selection { background-color: #D4FF2E; color: black; }
    
    /* The massive, ultra-condensed header font */
    .font-massive {
      font-family: 'Anton', sans-serif;
      letter-spacing: 0.02em;
    }

    /* The exact pill shape for the floating headshot */
    #floating-headshot {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px; /* Exact pill width */
      height: 380px; /* Exact pill height */
      border-radius: 200px; /* Creates the perfect pill */
      pointer-events: none;
      object-fit: cover;
      object-position: center top; /* Ensures your face stays centered in the cutout */
      z-index: 50;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.8);
      transition: opacity 0.3s ease, transform 0.3s ease;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    
    #floating-headshot.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- NAVIGATION BAR -->
  <nav class="w-full flex items-center justify-between px-6 py-6 md:px-10 max-w-7xl mx-auto">
    <img src="Q.png" alt="Logo" class="h-8 object-contain" />
    
    <div class="flex items-center gap-5">
      <!-- Theme Toggle matching the exact visual state -->
      <div class="w-[52px] h-[30px] bg-[#1A1A1A] rounded-full p-1 flex items-center cursor-pointer border border-[#2A2A2A]">
        <div class="w-[22px] h-[22px] bg-[#0A0A0A] rounded-full"></div>
      </div>
      
      <!-- CTA Button with exact padding and border radius -->
      <button class="bg-[#F4F4F4] text-black font-semibold text-[15px] px-5 py-2 rounded-[100px] hover:scale-105 transition-transform duration-300">
        Let's Work Together 🚀
      </button>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <section class="relative flex flex-col items-center justify-center flex-grow mt-12 px-4">
    
    <p class="text-[#7A7A7A] uppercase tracking-[0.25em] text-[11px] md:text-[13px] mb-8 font-medium z-10 text-center">
      Meet Quadri — Your Strategic Growth Partner
    </p>

    <!-- Massive Hoverable Text with tight line-height -->
    <h1 id="hover-trigger" class="font-massive text-[#D4FF2E] text-[120px] md:text-[220px] lg:text-[280px] leading-[0.8] text-center z-10 cursor-default uppercase">
      Quadri<br />Aminu
    </h1>
  </section>

  <!-- INTRODUCTION SECTION -->
  <section class="flex flex-col items-center mt-24 md:mt-32 px-6 max-w-[850px] mx-auto pb-32">
    <div class="text-[#D4FF2E] text-3xl mb-10">✦</div>
    <p class="text-[#D1D1D1] text-[22px] md:text-[28px] leading-[1.6] text-center font-medium">
      I'm Quadri Aminu, a Product & Delivery Leader blending product strategy, 
      operational clarity, and technical execution to build digital systems that 
      work simply, scale effortlessly, and serve real user needs.
    </p>
  </section>

  <!-- The Floating Image -->
  <img id="floating-headshot" src="headshot.png" alt="Quadri">

  <!-- JavaScript for exact cursor tracking -->
  <script>
    const img = document.getElementById('floating-headshot');
    const trigger = document.getElementById('hover-trigger');
    
    let mouseX = 0, mouseY = 0;
    let currentX = 0, currentY = 0;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    trigger.addEventListener('mouseenter', () => img.classList.add('visible'));
    trigger.addEventListener('mouseleave', () => img.classList.remove('visible'));

    function animate() {
      // 0.15 gives that exact Framer spring drag feel
      currentX += (mouseX - currentX) * 0.15;
      currentY += (mouseY - currentY) * 0.15;
      
      img.style.left = `${currentX}px`;
      img.style.top = `${currentY}px`;
      
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
