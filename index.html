<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadri Aminu</title>
  
  <!-- Importing the exact typography matched from your Framer settings -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      background-color: #121212;
      color: white;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
    }
    ::selection { background-color: #D4FF2E; color: black; }
    
    /* V2 Update: Exact 1:1 Typography properties from Framer */
    .font-massive {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 260px;
      line-height: 110%;
      letter-spacing: -0.02em;
      font-weight: 700;
    }

    /* Scaling down gracefully for laptops/mobile so the 260px text doesn't overflow */
    @media (max-width: 1024px) {
      .font-massive { font-size: 140px; }
    }
    @media (max-width: 640px) {
      .font-massive { font-size: 100px; }
    }

    /* V2 Update: Exact headshot pill dimensions (176x280) */
    #floating-headshot {
      position: fixed;
      top: 0;
      left: 0;
      width: 176px; 
      height: 280px; 
      border-radius: 200px;
      pointer-events: none;
      object-fit: cover;
      object-position: center; 
      z-index: 50;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.8);
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    
    #floating-headshot.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- V2 Update: Locked navigation width to 928px max to match Framer -->
  <nav class="w-full flex items-center justify-between px-6 py-10 max-w-[928px] mx-auto">
    <img src="Q.png" alt="Logo" class="h-8 object-contain" />
    
    <!-- V2 Update: Refined spacing and button padding -->
    <div class="flex items-center gap-[40px] md:gap-[60px]">
      <!-- Fixed toggle dimensions -->
      <div class="w-[52px] h-[30px] bg-[#1A1A1A] rounded-full p-1 flex items-center cursor-pointer border border-[#2A2A2A]">
        <div class="w-[22px] h-[22px] bg-[#0A0A0A] rounded-full shadow-sm"></div>
      </div>
      
      <!-- Fixed button styling and crisp white contrast -->
      <button class="bg-[#F4F4F4] text-black font-semibold text-[14px] px-6 py-2.5 rounded-[100px] hover:scale-105 transition-transform duration-300 whitespace-nowrap">
        Let's Work Together 🚀
      </button>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <section class="relative flex flex-col items-center justify-center flex-grow mt-[80px] px-4">
    
    <p class="text-[#7A7A7A] uppercase tracking-[0.25em] text-[11px] md:text-[13px] mb-8 font-medium z-10 text-center">
      Meet Quadri — Your Strategic Growth Partner
    </p>

    <!-- The 260px Header -->
    <h1 id="hover-trigger" class="font-massive text-[#D4FF2E] text-center z-10 cursor-default uppercase">
      Quadri<br />Aminu
    </h1>
  </section>

  <!-- INTRODUCTION SECTION -->
  <section class="flex flex-col items-center mt-24 md:mt-32 px-6 max-w-[850px] mx-auto pb-32">
    <div class="text-[#D4FF2E] text-3xl mb-10">✦</div>
    <p class="text-[#D1D1D1] text-[22px] md:text-[28px] leading-[1.6] text-center font-medium">
      I'm Quadri Aminu, a Product & Delivery Leader blending product strategy, 
      operational clarity, and technical execution to build digital systems that 
      work simply, scale effortlessly, and serve real user needs.
    </p>
  </section>

  <img id="floating-headshot" src="headshot.png" alt="Quadri">

  <!-- V2 Update: Bug fixes for the floating headshot behavior -->
  <script>
    const img = document.getElementById('floating-headshot');
    const trigger = document.getElementById('hover-trigger');
    
    let mouseX = 0, mouseY = 0;
    let currentX = 0, currentY = 0;
    let isHovering = false;

    // Track mouse globally so the math always knows where you are
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    trigger.addEventListener('mouseenter', (e) => {
      isHovering = true;
      
      // SNAP TO CURSOR: Forces the image to spawn exactly where your mouse entered the text
      currentX = e.clientX;
      currentY = e.clientY;
      mouseX = e.clientX;
      mouseY = e.clientY;
      
      img.style.left = `${currentX}px`;
      img.style.top = `${currentY}px`;
      
      img.classList.add('visible');
    });

    // STRICT BOUNDARY: The image completely disappears if you leave the text
    trigger.addEventListener('mouseleave', () => {
      isHovering = false;
      img.classList.remove('visible');
    });

    // Smooth spring animation loop
    function animate() {
      if (isHovering) {
        currentX += (mouseX - currentX) * 0.15;
        currentY += (mouseY - currentY) * 0.15;
        img.style.left = `${currentX}px`;
        img.style.top = `${currentY}px`;
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
